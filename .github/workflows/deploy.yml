name: CI/CD Pipeline - Chest X-Ray AI & AWS Cloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  S3_BUCKET: chest-xray-images-399855128301
  LAMBDA_FUNCTION_NAME: chest-xray-detection-api
  API_GATEWAY_URL: https://htnu5kgc06.execute-api.ap-southeast-2.amazonaws.com

jobs:
  # ========================================================
  # 1. FRONTEND CI (React + Vite Build & Lint)
  # ========================================================
  frontend-ci:
    name: Frontend (React + Vite) Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  # ========================================================
  # 2. BACKEND CI (FastAPI & Serverless Code Checks)
  # ========================================================
  backend-ci:
    name: Backend & Lambda Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Lint & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest boto3

      - name: Python Syntax & Lint Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,frontend
          # Validate Lambda handler syntax
          python -m py_compile lambda_function.py
          python -m py_compile backend/main.py

  # ========================================================
  # 3. AWS CLOUD CD (Deploy S3 Models & AWS Lambda)
  # ========================================================
  deploy-aws:
    name: Deploy to AWS Lambda & S3
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Lambda Container Image
        env:
          ECR_REGISTRY: 399855128301.dkr.ecr.ap-southeast-2.amazonaws.com
          ECR_REPOSITORY: chest-xray-backend
          IMAGE_TAG: latest
        run: |
          echo "Building Docker container for Lambda PyTorch backend..."
          docker build -f Dockerfile.lambda -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          echo "Pushing Docker image to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy Container to AWS Lambda
        env:
          ECR_IMAGE: 399855128301.dkr.ecr.ap-southeast-2.amazonaws.com/chest-xray-backend:latest
          ROLE_ARN: arn:aws:iam::399855128301:role/chest-xray-lambda-execution-role
        run: |
          echo "Checking package type of Lambda function..."
          PACKAGE_TYPE=$(aws lambda get-function-configuration --function-name $LAMBDA_FUNCTION_NAME --region $AWS_REGION --query 'PackageType' --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$PACKAGE_TYPE" = "Zip" ]; then
            echo "Re-creating Lambda function with Image package type..."
            aws lambda delete-function --function-name $LAMBDA_FUNCTION_NAME --region $AWS_REGION
            sleep 5
            PACKAGE_TYPE="NOT_FOUND"
          fi

          if [ "$PACKAGE_TYPE" = "NOT_FOUND" ]; then
            echo "Creating new container-based Lambda function..."
            aws lambda create-function \
              --function-name $LAMBDA_FUNCTION_NAME \
              --package-type Image \
              --code ImageUri=$ECR_IMAGE \
              --role $ROLE_ARN \
              --timeout 60 \
              --memory-size 3008 \
              --environment "Variables={AWS_S3_BUCKET_NAME=$S3_BUCKET,AWS_REGION=$AWS_REGION}" \
              --region $AWS_REGION

            sleep 10
            aws lambda add-permission \
              --function-name $LAMBDA_FUNCTION_NAME \
              --statement-id ApiGatewayInvokePermission \
              --action lambda:InvokeFunction \
              --principal apigateway.amazonaws.com \
              --region $AWS_REGION || true

            aws lambda create-function-url-config \
              --function-name $LAMBDA_FUNCTION_NAME \
              --auth-type NONE \
              --cors '{"AllowOrigins":["*"],"AllowMethods":["*"],"AllowHeaders":["*"],"MaxAge":86400}' \
              --region $AWS_REGION || true

            aws lambda add-permission \
              --function-name $LAMBDA_FUNCTION_NAME \
              --statement-id FunctionURLAllowPublicAccess \
              --action lambda:InvokeFunctionUrl \
              --principal "*" \
              --function-url-auth-type NONE \
              --region $AWS_REGION || true

            aws lambda add-permission \
              --function-name $LAMBDA_FUNCTION_NAME \
              --statement-id FunctionURLAllowInvoke \
              --action lambda:InvokeFunction \
              --principal "*" \
              --region $AWS_REGION || true
          else
            echo "Updating existing container Lambda function..."
            aws lambda update-function-code \
              --function-name $LAMBDA_FUNCTION_NAME \
              --image-uri $ECR_IMAGE \
              --region $AWS_REGION

            aws lambda update-function-configuration \
              --function-name $LAMBDA_FUNCTION_NAME \
              --timeout 60 \
              --memory-size 3008 \
              --environment "Variables={AWS_S3_BUCKET_NAME=$S3_BUCKET,AWS_REGION=$AWS_REGION}" \
              --region $AWS_REGION
          fi

      - name: Sync Model Metadata to AWS S3
        run: |
          echo "Syncing model labels & metadata to s3://$S3_BUCKET/models/..."
          aws s3 cp torchxrayvision_densenet121_4class.labels.json s3://$S3_BUCKET/models/ --region $AWS_REGION || true
          aws s3 cp torchxrayvision_densenet121_4class.metadata.json s3://$S3_BUCKET/models/ --region $AWS_REGION || true

      - name: Deploy React Frontend to AWS S3 Website
        run: |
          echo "Building & Deploying React frontend to s3://chest-xray-ui-399855128301..."
          cd frontend
          npm ci
          VITE_API_BASE_URL="$API_GATEWAY_URL" npm run build
          aws s3 sync dist/ s3://chest-xray-ui-399855128301/ --delete --region $AWS_REGION

      - name: Verify Live Deployment (Smoke Test)
        run: |
          echo "Pinging live API endpoint: $API_GATEWAY_URL/health"
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API_GATEWAY_URL/health")
          echo "HTTP Response: $RESPONSE_CODE"
          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "Deployment verification failed with status $RESPONSE_CODE"
            exit 1
          fi
          echo "✓ Live cloud API health check passed (HTTP 200 OK)!"
          echo "✓ Live Frontend Website: http://chest-xray-ui-399855128301.s3-website-ap-southeast-2.amazonaws.com"

