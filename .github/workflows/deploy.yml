name: CI/CD Pipeline - Chest X-Ray AI & AWS Cloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  S3_BUCKET: chest-xray-images-399855128301
  S3_FRONTEND_BUCKET: chest-xray-ui-399855128301
  LAMBDA_FUNCTION_NAME: chest-xray-detection-api
  API_GATEWAY_URL: https://htnu5kgc06.execute-api.ap-southeast-2.amazonaws.com

jobs:
  # ========================================================
  # 1. FRONTEND CI (React + Vite Build & Lint)
  # ========================================================
  frontend-ci:
    name: Frontend (React + Vite) Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  # ========================================================
  # 2. BACKEND CI (FastAPI & Serverless Code Checks)
  # ========================================================
  backend-ci:
    name: Backend & Lambda Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Lint & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest boto3

      - name: Python Syntax & Lint Check
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,frontend
          python -m py_compile lambda_function.py
          python -m py_compile backend/main.py

  # ========================================================
  # 3. AWS CLOUD CD (Deploy S3 Models, Lambda & Frontend)
  # ========================================================
  deploy-aws:
    name: Deploy to AWS Lambda & S3
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda Function
        run: |
          echo "Packaging lambda_function.py into lambda_package.zip..."
          zip -j lambda_package.zip lambda_function.py

      - name: Deploy Lambda Code
        run: |
          echo "Deploying updated serverless code to AWS Lambda: $LAMBDA_FUNCTION_NAME..."
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --zip-file fileb://lambda_package.zip \
            --region $AWS_REGION

      - name: Sync Model Metadata to AWS S3
        run: |
          echo "Syncing model labels & metadata to s3://$S3_BUCKET/models/..."
          aws s3 cp torchxrayvision_densenet121_4class.labels.json s3://$S3_BUCKET/models/ --region $AWS_REGION || true
          aws s3 cp torchxrayvision_densenet121_4class.metadata.json s3://$S3_BUCKET/models/ --region $AWS_REGION || true

      - name: Deploy React Frontend to AWS S3 Website
        run: |
          echo "Building & Deploying React frontend to s3://$S3_FRONTEND_BUCKET..."
          cd frontend
          npm ci
          VITE_API_BASE_URL="$API_GATEWAY_URL" npm run build
          # Sync static assets
          aws s3 sync dist/ s3://$S3_FRONTEND_BUCKET/ --delete --region $AWS_REGION
          # Upload index.html with no-cache so browsers always get the latest code
          aws s3 cp dist/index.html s3://$S3_FRONTEND_BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html" \
            --region $AWS_REGION

      - name: Verify Live Deployment (Smoke Test)
        run: |
          echo "Pinging live API endpoint: $API_GATEWAY_URL/health"
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API_GATEWAY_URL/health")
          echo "HTTP Response: $RESPONSE_CODE"
          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "Deployment verification failed with status $RESPONSE_CODE"
            exit 1
          fi
          echo "✓ Live cloud API health check passed (HTTP 200 OK)!"
          echo "✓ Live Frontend Website: http://$S3_FRONTEND_BUCKET.s3-website-$AWS_REGION.amazonaws.com"
